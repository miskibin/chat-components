      .bar-peak { fill: #d4d4d8 }
    }
  </style>
  <rect class="plot" width="320" height="120" rx="6" />
  <rect class="bar" x="16" y="70" width="40" height="34" />
  <rect class="bar" x="72" y="46" width="40" height="58" />
  <rect class="bar-peak" x="128" y="28" width="40" height="76" />
  <rect class="bar" x="184" y="58" width="40" height="46" />
  <rect class="bar-peak" x="240" y="18" width="40" height="86" />
</svg>
