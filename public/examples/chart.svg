<svg xmlns="http://www.w3.org/2000/svg" width="320" height="120" viewBox="0 0 320 120" role="img" aria-label="Turn latency over the last five runs">
  <style>
    .plot { fill: #f4f4f5 }
    .bar { fill: #71717a }
